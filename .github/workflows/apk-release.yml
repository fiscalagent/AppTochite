name: Build & publish release APK

# Собирает ПОДПИСАННЫЙ release-APK и прикрепляет его к GitHub Release.
# Основной триггер — workflow_dispatch из deploy.yml после semantic-release:
# релиз, созданный с GITHUB_TOKEN, НЕ рождает событие release:published
# (анти-рекурсия GitHub), так что триггер release ниже сработает только
# для релиза, созданного вручную или с PAT.
# Лендинг apptochite.github.io ссылается на новейший ассет через
#   https://github.com/fiscalagent/AppTochite/releases/latest/download/app-release.apk
# поэтому передеплой лендинга при каждом релизе не нужен.
#
# Требует 4 секрета репозитория (Ф0, зона юзера):
#   ANDROID_KEYSTORE_BASE64    — base64 от release.keystore
#   ANDROID_KEYSTORE_PASSWORD  — пароль хранилища
#   ANDROID_KEY_ALIAS          — алиас ключа
#   ANDROID_KEY_PASSWORD       — пароль ключа

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза для пересборки APK (напр. v2.0.0)'
        required: true

permissions:
  contents: write # для gh release upload

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build web bundle + sync to android
        run: npm run build:cap
        env:
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
          VITE_YANDEX_CLIENT_ID: ${{ secrets.VITE_YANDEX_CLIENT_ID }}

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK to release
        run: gh release upload "${{ github.event.release.tag_name || github.event.inputs.tag }}" android/app/build/outputs/apk/release/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
