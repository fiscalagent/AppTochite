name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # gh workflow run apk-release.yml после релиза

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Релиз, созданный с GITHUB_TOKEN, не рождает событие release:published
        # (анти-рекурсия GitHub), поэтому apk-release.yml сам не стартует.
        # Ловим новый тег сравнением до/после и дёргаем сборку APK явно ниже —
        # workflow_dispatch из GITHUB_TOKEN разрешён.
        run: |
          before=$(git tag --list 'v*' --sort=-v:refname | head -1)
          npx semantic-release
          git fetch --tags --quiet
          after=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ "$after" != "$before" ]; then
            echo "released=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger APK build
        if: steps.semrel.outputs.released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run apk-release.yml -f tag="${{ steps.semrel.outputs.released }}"

      - run: npm run build
        env:
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
          VITE_YANDEX_CLIENT_ID: ${{ secrets.VITE_YANDEX_CLIENT_ID }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment
